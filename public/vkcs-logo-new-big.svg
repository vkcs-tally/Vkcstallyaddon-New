<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Pearl bead radial gradient with 3D spherical depth -->
    <radialGradient id="pearlSphere" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#f8fafc" />
      <stop offset="60%" stop-color="#e2e8f0" />
      <stop offset="85%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#64748b" />
    </radialGradient>

    <!-- Pearl drop shadow -->
    <filter id="pearlDropShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="1" dy="3" stdDeviation="2.5" flood-color="#001845" flood-opacity="0.5" />
    </filter>

    <!-- Soft drop shadow for yellow VKCS center typography -->
    <filter id="vkcsShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#001a4d" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Circular Royal Cobalt Blue Background -->
  <circle cx="250" cy="250" r="250" fill="#0052b4" />

  <!-- Outer White Concentric Ring -->
  <circle cx="250" cy="250" r="230" fill="none" stroke="#ffffff" stroke-width="4.5" />

  <!-- Inner White Concentric Ring -->
  <circle cx="250" cy="250" r="158" fill="none" stroke="#ffffff" stroke-width="3.5" />

  <!-- DEVELOPING (Arched across top band) -->
  <g id="developingText">
    <text x="95.06" y="133.25" text-anchor="middle" dominant-baseline="central" fill="#ffffff" font-family="'Century Gothic', 'Tw Cen MT', 'Montserrat', 'Segoe UI', sans-serif" font-size="36" font-weight="800" transform="rotate(-53.00 95.06 133.25)">D</text>
    <text x="122.16" y="104.08" text-anchor="middle" dominant-baseline="central" fill="#ffffff" font-family="'Century Gothic', 'Tw Cen MT', 'Montserrat', 'Segoe UI', sans-serif" font-size="36" font-weight="800" transform="rotate(-41.22 122.16 104.08)">E</text>
    <text x="154.63" y="81.06" text-anchor="middle" dominant-baseline="central" fill="#ffffff" font-family="'Century Gothic', 'Tw Cen MT', 'Montserrat', 'Segoe UI', sans-serif" font-size="36" font-weight="800" transform="rotate(-29.44 154.63 81.06)">V</text>
    <text x="191.13" y="65.15" text-anchor="middle" dominant-baseline="central" fill="#ffffff" font-family="'Century Gothic', 'Tw Cen MT', 'Montserrat', 'Segoe UI', sans-serif" font-size="36" font-weight="800" transform="rotate(-17.67 191.13 65.15)">E</text>
    <text x="230.10" y="57.02" text-anchor="middle" dominant-baseline="central" fill="#ffffff" font-family="'Century Gothic', 'Tw Cen MT', 'Montserrat', 'Segoe UI', sans-serif" font-size="36" font-weight="800" transform="rotate(-5.89 230.10 57.02)">L</text>
    <text x="269.90" y="57.02" text-anchor="middle" dominant-baseline="central" fill="#ffffff" font-family="'Century Gothic', 'Tw Cen MT', 'Montserrat', 'Segoe UI', sans-serif" font-size="36" font-weight="800" transform="rotate(5.89 269.90 57.02)">O</text>
    <text x="308.87" y="65.15" text-anchor="middle" dominant-baseline="central" fill="#ffffff" font-family="'Century Gothic', 'Tw Cen MT', 'Montserrat', 'Segoe UI', sans-serif" font-size="36" font-weight="800" transform="rotate(17.67 308.87 65.15)">P</text>
    <text x="345.37" y="81.06" text-anchor="middle" dominant-baseline="central" fill="#ffffff" font-family="'Century Gothic', 'Tw Cen MT', 'Montserrat', 'Segoe UI', sans-serif" font-size="36" font-weight="800" transform="rotate(29.44 345.37 81.06)">I</text>
