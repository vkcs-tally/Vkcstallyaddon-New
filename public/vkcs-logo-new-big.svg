    <text x="250.00" y="444.00" text-anchor="middle" dominant-baseline="central" fill="#ffffff" font-family="'Century Gothic', 'Tw Cen MT', 'Montserrat', 'Segoe UI', sans-serif" font-size="33" font-weight="700" transform="rotate(0.00 250.00 444.00)">O</text>
    <text x="282.26" y="441.30" text-anchor="middle" dominant-baseline="central" fill="#ffffff" font-family="'Century Gothic', 'Tw Cen MT', 'Montserrat', 'Segoe UI', sans-serif" font-size="33" font-weight="700" transform="rotate(-9.57 282.26 441.30)">L</text>
    <text x="313.62" y="433.27" text-anchor="middle" dominant-baseline="central" fill="#ffffff" font-family="'Century Gothic', 'Tw Cen MT', 'Montserrat', 'Segoe UI', sans-serif" font-size="33" font-weight="700" transform="rotate(-19.14 313.62 433.27)">U</text>
    <text x="343.21" y="420.14" text-anchor="middle" dominant-baseline="central" fill="#ffffff" font-family="'Century Gothic', 'Tw Cen MT', 'Montserrat', 'Segoe UI', sans-serif" font-size="33" font-weight="700" transform="rotate(-28.71 343.21 420.14)">T</text>
    <text x="370.20" y="402.28" text-anchor="middle" dominant-baseline="central" fill="#ffffff" font-family="'Century Gothic', 'Tw Cen MT', 'Montserrat', 'Segoe UI', sans-serif" font-size="33" font-weight="700" transform="rotate(-38.29 370.20 402.28)">I</text>
