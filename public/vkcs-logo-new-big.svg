    <text x="413.49" y="354.44" text-anchor="middle" dominant-baseline="central" fill="#ffffff" font-family="'Century Gothic', 'Tw Cen MT', 'Montserrat', 'Segoe UI', sans-serif" font-size="33" font-weight="700" transform="rotate(-57.43 413.49 354.44)">N</text>
    <text x="428.58" y="325.80" text-anchor="middle" dominant-baseline="central" fill="#ffffff" font-family="'Century Gothic', 'Tw Cen MT', 'Montserrat', 'Segoe UI', sans-serif" font-size="33" font-weight="700" transform="rotate(-67.00 428.58 325.80)">S</text>
  </g>

  <!-- Left Pearl Pin Bead -->
  <g filter="url(#pearlDropShadow)">
    <circle cx="51" cy="250" r="18" fill="url(#pearlSphere)" />
    <ellipse cx="44" cy="243" rx="5.5" ry="3.5" transform="rotate(-30 44 243)" fill="#ffffff" opacity="0.9" />
  </g>

  <!-- Right Pearl Pin Bead -->
  <g filter="url(#pearlDropShadow)">
    <circle cx="449" cy="250" r="18" fill="url(#pearlSphere)" />
    <ellipse cx="442" cy="243" rx="5.5" ry="3.5" transform="rotate(-30 442 243)" fill="#ffffff" opacity="0.9" />
  </g>

  <!-- Center Big Bold Yellow 'VKCS' -->
  <text
    x="250"
    y="284"
    fill="#ffd200"
    font-family="'Century Gothic', 'Tw Cen MT', 'Montserrat', 'Arial Black', sans-serif"
    font-size="96"
    font-weight="900"
    text-anchor="middle"
    letter-spacing="1.5"
    filter="url(#vkcsShadow)"
  >
